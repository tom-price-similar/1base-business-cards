<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2c2b3e">
    <title>1Base - Max Off</title>
        <style>
@font-face {
    font-family: 'Coolvetica';
    src: url('https://firebasestorage.googleapis.com/v0/b/onebase-f1c95.firebasestorage.app/o/onebase_business_cards%2Ffonts%2FCoolvetica-Regular.woff2?alt=media&token=cd65597d-31b2-41b5-afff-858fc6e5b75f') format('woff2');
    font-weight: normal;
    font-style: normal;
}

@font-face {
    font-family: 'Helixa';
    src: url('https://firebasestorage.googleapis.com/v0/b/onebase-f1c95.firebasestorage.app/o/onebase_business_cards%2Ffonts%2FHelixa-Regular.woff2?alt=media&token=e61de9de-6e41-4587-973d-aa6aaf6d1dbf') format('woff2');
    font-weight: normal;
    font-style: normal;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Coolvetica', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}

body {
    background-color: #1B0E2E;
    min-height: 100vh;
    min-height: 100svh; /* Use small viewport height for mobile */
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 10px;
    overflow: hidden; /* Prevent body scroll */
}

.dark-theme {
    background-color: #1B0E2E;
    min-height: 100vh;
}

.card-container {
    width: 100%;
    max-width: min(95vw, 95vh * 0.6, 400px);
    height: auto;
    max-height: 95vh;
    max-height: 95svh; /* Use small viewport height for mobile */
}

.card-container.dark-theme {
    display: flex;
    align-items: center;
    justify-content: center;
}

.card {
    background-color: white;
    border-radius: 15px;
    box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
    overflow: hidden;
    padding: 30px;
}

.business-card {
    background-image: url('https://firebasestorage.googleapis.com/v0/b/onebase-f1c95.firebasestorage.app/o/onebase_business_cards%2Fimages%2Fbg.svg?alt=media&token=c7514381-8d3a-41ca-a691-a58034749e47');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    border-radius: 32px;
    padding: 20px;
    color: white;
    width: 100%;
    height: auto;
    max-height: 95vh;
    max-height: 95svh; /* Use small viewport height for mobile */
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.card-header {
    margin-bottom: 30px;
    flex-shrink: 0;
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;
}

.company-logo-text {
    font-size: 28px;
    font-weight: 600;
    color: white;
}

.card-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 0; /* Allow shrinking */
}

.card-content h2 {
    font-size: clamp(1.2em, 4vw, 1.6em);
    font-weight: 400;
    line-height: 1.2;
    margin-bottom: 60px;
    color: #e5e5e5;
}

.contact-details {
    margin-bottom: 20px;
    flex: 1;
}

.contact-section {
    margin-bottom: 15px;
}

.contact-section label {
    font-family: 'Helixa', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    font-size: 12px;
    color: #8b8b9a;
    text-transform: uppercase;
    letter-spacing: 1px;
    display: block;
    margin-bottom: 8px;
}

.contact-value {
    font-family: 'Helixa', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    font-size: clamp(16px, 4vw, 18px);
    color: white;
    text-decoration: none;
    display: block;
}

.contact-value:hover {
    color: #8b5cf6;
    transition: color 0.3s ease;
}

.qr-section {
    display: flex;
    justify-content: center;
    margin-bottom: 10px;
    flex-shrink: 0;
}

.qr-code-container {
    background: white;
    padding: 15px;
    border-radius: 15px;
    display: inline-block;
}

.qr-code-container canvas {
    min-width: 150px;
    max-width: 200px;
    height: auto !important;
    width: auto !important;
}

.qr-code-container canvas {
    display: block;
}

.card-actions {
    display: flex;
    gap: 15px;
}

.action-btn {
    flex: 1;
    padding: 14px 24px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.3s ease;
    background-color: #3e3d4e;
    color: white;
}

.action-btn.primary {
    background-color: #6366f1;
}

.action-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
}

.action-btn.primary:hover {
    background-color: #5558e3;
}

.profile {
    text-align: center;
    margin-bottom: 25px;
}

.profile-img {
    width: 120px;
    height: 120px;
    margin: 0 auto 15px;
    border-radius: 50%;
    overflow: hidden;
    border: 3px solid #007bff;
}

.profile-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.profile h1 {
    font-size: 24px;
    margin-bottom: 5px;
    color: #333;
}

.profile h2 {
    font-size: 16px;
    font-weight: 500;
    color: #555;
    margin-bottom: 5px;
}

.profile p {
    font-size: 14px;
    color: #777;
}

.contact-info {
    margin-bottom: 25px;
}

.contact-item {
    display: flex;
    align-items: center;
    margin-bottom: 12px;
}

.contact-item img {
    width: 20px;
    height: 20px;
    margin-right: 15px;
}

.contact-item a, .contact-item p {
    font-size: 14px;
    color: #555;
    text-decoration: none;
}

.social-links {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 25px;
}

.social-icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background-color: #f0f0f0;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: all 0.3s ease;
}

.social-icon:hover {
    background-color: #007bff;
}

.social-icon img {
    width: 20px;
    height: 20px;
}

.actions {
    display: flex;
    gap: 15px;
}

button {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
}

#share-btn {
    background-color: #007bff;
    color: white;
}

#save-contact-btn {
    background-color: #f0f0f0;
    color: #333;
}

#share-btn:hover {
    background-color: #0069d9;
}

#save-contact-btn:hover {
    background-color: #e2e2e2;
}

/* Media query for landscape orientation */
@media (orientation: landscape) and (max-height: 500px) {
    .card {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
    }
    
    .profile {
        grid-column: 1;
        grid-row: 1 / 3;
    }
    
    .contact-info {
        grid-column: 2;
        grid-row: 1;
    }
    
    .social-links, .actions {
        grid-column: 2;
        grid-row: 2;
    }
}

/* Form Styles */
.create-container {
    width: 100%;
    max-width: 500px;
    margin: 0 auto;
    padding: 20px;
}

.form-card {
    background-color: white;
    border-radius: 32px;
    box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
    padding: 40px;
}

.form-card h1 {
    font-size: 28px;
    color: #2c2b3e;
    margin-bottom: 10px;
    text-align: center;
}

.subtitle {
    font-size: 16px;
    color: #666;
    text-align: center;
    margin-bottom: 30px;
}

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    font-size: 14px;
    font-weight: 500;
    color: #2c2b3e;
    margin-bottom: 8px;
}

.form-group input {
    width: 100%;
    padding: 12px 16px;
    border: 2px solid #e5e5e5;
    border-radius: 8px;
    font-size: 16px;
    transition: all 0.3s ease;
}

.form-group input:focus {
    outline: none;
    border-color: #6366f1;
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
}

.generate-btn {
    width: 100%;
    padding: 16px;
    background-color: #6366f1;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 18px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.3s ease;
    margin-top: 10px;
}

.generate-btn:hover {
    background-color: #5558e3;
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(99, 102, 241, 0.3);
}

/* Mobile optimizations */
@media (max-width: 480px) {
    body {
        padding: 5px;
    }
    
    .business-card {
        padding: 15px;
        border-radius: 20px;
        max-height: 98vh;
        max-height: 98svh;
    }
    
    .card-header {
        margin-bottom: 30px;
    }
    
    .logo svg {
        width: 100px;
        height: 35px;
    }
    
    .card-content h2 {
        font-size: 1.8em;
        margin-bottom: 30px;
        line-height: 1.1;
    }
    
    .contact-section {
        margin-bottom: 30px;
    }
    
    .contact-section label {
        font-size: 11px;
        margin-bottom: 6px;
    }
    
    .contact-value {
        font-size: clamp(14px, 4vw, 16px);
    }
    
    .qr-code-container {
        padding: 12px;
    }
    
    .qr-code-container canvas {
        min-width: 140px;
        max-width: 180px;
    }
}

/* Very small screens */
@media (max-width: 360px) {
    .business-card {
        padding: 12px;
        max-height: 99vh;
        max-height: 99svh;
    }
    
    .card-content h2 {
        font-size: clamp(1em, 4vw, 1.2em);
    }
    
    .contact-value {
        font-size: clamp(13px, 4vw, 15px);
    }
    
    .qr-code-container canvas {
        min-width: 120px;
        max-width: 150px;
    }
}

/* Landscape mobile optimization */
@media (max-height: 500px) and (orientation: landscape) {
    .business-card {
        flex-direction: row;
        gap: 20px;
        max-height: 95vh;
        max-height: 95svh;
    }
    
    .card-header {
        margin-bottom: 0;
        flex: 0 0 auto;
    }
    
    .card-content {
        flex: 1;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 15px;
        align-items: start;
    }
    
    .qr-section {
        grid-column: 2;
        grid-row: 1 / -1;
        margin-bottom: 0;
        align-self: center;
    }
    
    .contact-details {
        grid-column: 1;
        margin-bottom: 0;
    }
}

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        // Generate QR code with contact info
        document.addEventListener('DOMContentLoaded', function() {
            const qrContainer = document.getElementById('qr-code');
            if (qrContainer) {
                // Clear any existing content
                qrContainer.innerHTML = '';
                
                const qrData = `BEGIN:VCARD
VERSION:3.0
FN:Max Off
N:Off;Max;;;
ORG:1base
TITLE:Project Manager 
TEL;TYPE=WORK,VOICE:+9710563127808
EMAIL;TYPE=WORK:maximilian@1base.io
URL:https://1base.io
END:VCARD`;
                
                try {
                    // Calculate QR code size based on screen width - minimum 150px for scannability
                    const isMobile = window.innerWidth <= 480;
                    const qrSize = isMobile ? Math.max(150, Math.min(180, window.innerWidth * 0.35)) : 200;
                    
                    new QRCode(qrContainer, {
                        text: qrData,
                        width: qrSize,
                        height: qrSize,
                        colorDark: "#000000",
                        colorLight: "#ffffff",
                        correctLevel: QRCode.CorrectLevel.M
                    });
                } catch (error) {
                    console.error('Error generating QR code:', error);
                    qrContainer.innerHTML = '<p style="color: #666; text-align: center;">QR Code generation failed</p>';
                }
            }
        });
        
        // PWA functionality
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js')
                    .then(reg => console.log('Service Worker registered'))
                    .catch(err => console.log('Service Worker registration failed: ', err));
            });
        }
    </script>
