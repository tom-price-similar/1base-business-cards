<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2c2b3e">
    <title>Create Digital Business Card</title>
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="create-container">
        <div class="form-card">
            <h1>Create Your Digital Business Card</h1>
            <p class="subtitle">Enter your contact details to generate your personalized business card</p>
            
            <form id="create-card-form">
                <div class="form-group">
                    <label for="name">Full Name *</label>
                    <input type="text" id="name" name="name" required placeholder="John Doe">
                </div>
                
                <div class="form-group">
                    <label for="company">Company *</label>
                    <input type="text" id="company" name="company" required placeholder="1base">
                </div>
                
                <div class="form-group">
                    <label for="phone">Phone Number *</label>
                    <input type="tel" id="phone" name="phone" required placeholder="+1 (555) 123-4567">
                </div>
                
                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" name="email" required placeholder="connect@1base.io">
                </div>
                
                <div class="form-group">
                    <label for="website">Website</label>
                    <input type="text" id="website" name="website" placeholder="1base.io">
                </div>
                
                <button type="submit" class="generate-btn">Generate Business Card</button>
            </form>
        </div>
    </div>
    
    <script src="scripts/create.js"></script>
</body>
</html>
